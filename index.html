body {
  margin: 0;
  font-family: 'Arial Black', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #111;
}

.design {
  position: relative;
  width: 360px;
  height: 700px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.design::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url('ghggg.png') center/cover no-repeat;
  filter: brightness(0.5);
  z-index: 0;
}

.shimmer {
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 30% 30%, rgba(0,255,255,0.08), transparent 35%),
    radial-gradient(circle at 70% 70%, rgba(255,0,255,0.08), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,255,0,0.06), transparent 45%);
  animation: shimmerMove 25s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}

@keyframes shimmerMove {
  0% { transform: translate(-100%, -100%) rotate(0deg); }
  50% { transform: translate(100%, 100%) rotate(180deg); }
  100% { transform: translate(-100%, -100%) rotate(360deg); }
}

.box {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: 2.2rem;
  background: linear-gradient(135deg, #00ffff, #00aaff, #0055ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(0,255,255,0.7);
  margin-bottom: 8px;
}

p {
  color: #fff;
  opacity: 0.85;
  margin-bottom: 18px;
  font-size: 1rem;
  text-transform: uppercase;
  text-align: center;
}

.btn {
  width: 90%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 50px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  font-size: 0.9rem;
  color: #fff;
  transition: 0.3s;
}

.btn:hover { transform: scale(1.05); }

.tiktok { background: #000; }
.telegram { background: #229ED9; }
.instagram {
  background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
}
.erenta {
  background: linear-gradient(90deg,#FF6A00,#FF8C42,#FFA85C);
}

/* ===== Донат ===== */
.donate {

  text-align: center;

.donate-title {

  margin-bottom: 8px;
  color: #00ffff;

.donate-box {
  background: rgba(0,0,0,0.45);
  border-radius: 12px;

  margin-bottom: 6px;
  font-size: 0.75rem;
  color: #fff;
  word-break: break-all;

.footer-text {

  font-size: 0.75rem;
  margin-top: 8px;
  opacity: 0.7;
  text-align: center;
}

/* TikTok Overlay */
.tiktok-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #fff;
  text-align: center;
}

.tiktok-overlay .arrow {
  position: absolute;
  top: 30px;
  right: 25px;
  font-size: 3rem;
  animation: arrowMove 1.5s infinite;
}

@keyframes arrowMove {
  0% { transform: translateY(0); opacity: 1; }
  50% { transform: translateY(-12px); opacity: 0.6; }
  100% { transform: translateY(0); opacity: 1; }
}

.tiktok-overlay .text {

  padding: 25px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 25px rgba(0,255,255,0.3);

<script>
function isTikTokBrowser() {
  return navigator.userAgent.toLowerCase().includes("tiktok");
}

document.addEventListener("DOMContentLoaded", () => {
  if (isTikTokBrowser()) {
    setTimeout(() => {
      document.getElementById("tiktokOverlay").style.display = "flex";
    }, 1500);
  }
});

document.getElementById("tiktokOverlay").addEventListener("click", () => {
  document.getElementById("tiktokOverlay").style.display = "none";
});
